[plugin]
name = "pipelex"
version = "0.18.0"
description = "Build and run AI methods from Mistral Vibe with Pipelex: skills that write them in MTHDS, and a hook that checks every edit."
source = "pipelex-vibe/"

[vars]
platform = "mistral-vibe"
harness_name = "Mistral Vibe"
skill_dir = "<skill-dir>"
# A Vibe plugin's skills are named `<plugin>:<skill>`, so the user types
# /pipelex:pipelex-design; scripts/check.py holds this to the manifest's name.
skill_prefix = "/pipelex:"
