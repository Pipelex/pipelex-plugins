# Default template variables shared by all build targets.
# Per-target .toml files can override any variable defined here.
#
# This set is deliberately small: the CLI-free plugin carries none of the
# install/upgrade/env-check switches (`min_mthds_version`, `env_check`,
# `can_run_methods`, `session_start_hook`, `*_install_cmd`/`*_upgrade_cmd`)
# that the `mthds-plugins` predecessor had. Reintroduce a variable only when a
# skill or hook actually branches on it.

[vars]
marketplace_name = "pipelex-plugins"
platform = "claude"
harness_name = "Claude Code"

# Where a skill's own files are, for a sentence that names one: a reference the
# skill copies verbatim, a script it runs. Claude Code substitutes
# ${CLAUDE_SKILL_DIR} in a skill body before the model reads it; Codex and
# Mistral Vibe substitute nothing, so they override this with a <skill-dir>
# placeholder that `templates/skills/shared/skill-dir.md.j2` defines in one
# sentence (wip/skill-size-diet/facts.md, sections 3 to 5).
skill_dir = "${CLAUDE_SKILL_DIR}"

# Version floors the skills state to the user. One table, so a bump is one edit
# rather than a hunt through prose. These are VALUE substitutions — the kind the
# trimmed-variable rule allows — not switches a skill branches on: nothing reads
# a floor to decide what to do, only to say what it is.
#
# The static references under `skills/` are copied verbatim into every target and
# are never rendered, so they keep their literals; `scripts/check.py`'s
# `check_version_floors` holds them to this table and names the file and line when
# one drifts. Bump here, run `make build`, and the check tells you which static
# references still say the old number.
#
# Each floor's meaning, because "the first release carrying X" is what makes a
# floor a fact rather than a preference:
#   pipelex_sdk_js   the first @pipelex/sdk with everything pipelex-integrate's
#                    call site and offline gate use (the run-results surface the
#                    call site hands back is the last of it to arrive)
#   pipelex_sdk_py   the pipelex-sdk pipelex-integrate installs, which is the
#                    higher of two facts rather than one. Everything the call
#                    site and the offline gate use had arrived by 0.10.1 (the
#                    run-results surface — the artifact stack, summarize_usage,
#                    working_memory — last of it, after the offline codegen
#                    check), and above that sits whatever pipelex-starter-python
#                    declares, because it is the reference project the skill's
#                    Python arm points at and a project set up below its pin
#                    cannot copy the code read from it. It is the starter that
#                    carries this floor today: its blocking mode reads a run
#                    through results_from_execute, which the SDK made public
#   pipelex_mcp      the last @pipelex/mcp that PREDATES the main-pipe signature
#                    in a validate verdict — the one floor stated as "and earlier",
#                    so a bump here means the signature arrived in a later release
#                    than this one and the sentence naming it has to be re-read
#   node             the Node the method app's `engines.node` names
#   python_min/max   the range `pipelex-sdk`'s `requires-python` names, which the
#                    initializer branch's Python project must be created on
[vars.floors]
pipelex_sdk_js = "0.18.0"
pipelex_sdk_py = "0.10.2"
pipelex_mcp = "0.13.0"
node = "22.12"
python_min = "3.11"
python_max = "3.14"

# The plugin-declared `pipelex-mcp` server is the LOCAL WORKSHOP LAUNCHER
# (stdio) — definitive, not a BYOK workaround: builders authoring local files
# are the plugin's audience, and the hosted console is a connector users add
# in their host's own UI, never a plugin declaration (rationale: the Pipelex
# workspace's wip/history/mcp-dual-deployment/pipelex-mcp-plugin-reconciliation.md
# §8). The workshop authenticates
# with PIPELEX_API_KEY / PIPELEX_BASE_URL. Credential delivery per platform:
# - Claude: the `user_config` tables below become the manifest's `userConfig`
#   (Claude prompts for them when the plugin is enabled; sensitive values go
#   to the OS keychain) and are injected into the spawn as PIPELEX_PLUGIN_*
#   via `${user_config.*}` substitution. The launch-pipelex-mcp.sh wrapper
#   promotes each one to its real PIPELEX_* name only when non-empty, so the
#   session env still works as a fallback. This is required for GUI launches
#   (Claude Desktop), which carry no shell environment at all. Do not
#   "simplify" this by injecting PIPELEX_* directly: an unfilled option then
#   substitutes to "" and shadows a working shell credential, which the MCP
#   tools report as a config-class Unauthorized that hard-stops every
#   MCP-backed skill (regressed in 0.3.1 — see docs/decisions.md).
# - Codex: `env_vars` names the variables Codex forwards into the spawn
#   (Codex whitelist-filters MCP spawn env; terminal sessions carry them).
# - Mistral Vibe: no manifest. mcp/vibe-mcp.toml renders command/args as a
#   [[mcp_servers]] stdio entry the user copies into ~/.vibe/config.toml, and
#   each env_vars name becomes an empty `env` key they fill in, because Vibe
#   forwards no shell env into the spawn and expands no variables.
# Dev override: point command/args at a local checkout
# (e.g. command = "node", args = ["../pipelex-mcp/dist/local/main.js"]) +
# `make build` on Claude; a same-named [mcp_servers.pipelex] entry in
# ~/.codex/config.toml on Codex.
[vars.mcp_server]
command = "npx"
args = ["-y", "@pipelex/mcp@latest"]
env_vars = ["PIPELEX_API_KEY", "PIPELEX_BASE_URL"]

# Claude plugin user configuration. Keys map onto env variables by convention:
# option `foo` is injected as PIPELEX_PLUGIN_FOO and promoted to PIPELEX_FOO
# (MCP launcher) / read from CLAUDE_PLUGIN_OPTION_FOO (hook wrapper).
[vars.mcp_server.user_config.api_key]
type = "string"
title = "Pipelex API key"
description = "API key for the hosted Pipelex API (bundle validation and runs). Get one at https://app.pipelex.com. Leave empty to work offline: local lint/format still run; validation and runs are skipped."
sensitive = true

[vars.mcp_server.user_config.base_url]
type = "string"
title = "Pipelex API base URL"
description = "Origin of the Pipelex API, host-only (e.g. https://api.pipelex.com). Leave empty for the hosted default."
