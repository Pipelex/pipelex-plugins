# Checks the plugin version against the branch flow:
#   - PR → main:            the version must be strictly greater than main's.
#   - PR → release/vX.Y.Z:   the version must equal X.Y.Z.
#   - PR from release/vX.Y.Z: the version must equal X.Y.Z.
#
# Those three are read under the trigger below, which fires on two bases only:
# `main` and `release/vX.Y.Z`. So the third rule reaches a release branch on its
# way into `main`, and a pull request *out of* a release branch into anything
# else — `dev`, or a branch below it in a stack — runs no job and is checked
# against nothing.
#
# The version of record is `targets/prod.toml`'s `[plugin].version`, which the
# repo's CLAUDE.md names the source of truth; `make check` is what holds every
# other target and the Claude marketplace to it, so this workflow checks the one
# thing that has nowhere else to be checked — that the number in the files and
# the number in the branch name are the same number. Until this existed, nothing
# outside the /release skill's own procedure compared them.
#
# Follows ../pipelex-sdk-js/.github/workflows/version-check.yml, reading
# `targets/prod.toml` where that one reads `package.json`. All PR refs travel
# through env: and are never interpolated into a shell command, because a fork's
# branch name is attacker-controlled text.
name: Version check

on:
  pull_request:
    # `edited` is what a retarget emits: a pull request opened against `dev` and
    # then corrected to `main` sends no `synchronize`, so without it a release
    # could reach `main` having never been version-checked at all.
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read PR version
        id: pr_version
        run: |
          VERSION=$(python3 -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("targets/prod.toml").read_text())["plugin"]["version"])')
          # No `ref:` is passed to the checkout above, so what this reads is the
          # pull request's merge commit — the tree that would land — and not its
          # head. Either way the value is somebody else's file, so it is validated
          # before it becomes a step output: a multi-line TOML string would
          # otherwise write extra keys into $GITHUB_OUTPUT, and anything
          # non-numeric would reach the comparison below as a shell error.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::targets/prod.toml [plugin].version is not an X.Y.Z version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PR version: $VERSION"

      - name: Validate base branch (target)
        id: base
        run: |
          if [[ "$BASE_BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "is_release_target=true" >> "$GITHUB_OUTPUT"
            echo "target_release_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate source branch
        id: source
        run: |
          if [[ "$SOURCE_BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "is_release_source=true" >> "$GITHUB_OUTPUT"
            echo "source_release_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version bump (PR → main)
        if: env.BASE_BRANCH == 'main'
        env:
          PR_VERSION: ${{ steps.pr_version.outputs.version }}
        run: |
          MAIN_VERSION=$(git show "origin/${BASE_BRANCH}:targets/prod.toml" \
            | python3 -c 'import sys,tomllib;print(tomllib.loads(sys.stdin.read())["plugin"]["version"])')
          if [[ ! "$MAIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version on $BASE_BRANCH is not an X.Y.Z version: $MAIN_VERSION"
            exit 1
          fi
          echo "Main version: $MAIN_VERSION"
          echo "PR version:   $PR_VERSION"

          compare_versions() {
            IFS='.' read -ra A <<< "$1"
            IFS='.' read -ra B <<< "$2"
            for i in 0 1 2; do
              if   [ "${A[$i]:-0}" -gt "${B[$i]:-0}" ]; then return 0
              elif [ "${A[$i]:-0}" -lt "${B[$i]:-0}" ]; then return 1
              fi
            done
            return 1
          }

          if ! compare_versions "$PR_VERSION" "$MAIN_VERSION"; then
            echo "::error::PR version ($PR_VERSION) must be greater than main version ($MAIN_VERSION)."
            exit 1
          fi
          echo "Version properly bumped: $MAIN_VERSION → $PR_VERSION"

      - name: Check version matches target release branch
        if: steps.base.outputs.is_release_target == 'true'
        env:
          PR_VERSION: ${{ steps.pr_version.outputs.version }}
          RELEASE_VERSION: ${{ steps.base.outputs.target_release_version }}
        run: |
          if [[ "$PR_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::targets/prod.toml version ($PR_VERSION) does not match target release branch (release/v$RELEASE_VERSION)."
            exit 1
          fi

      - name: Check version matches source release branch
        if: steps.source.outputs.is_release_source == 'true'
        env:
          PR_VERSION: ${{ steps.pr_version.outputs.version }}
          RELEASE_VERSION: ${{ steps.source.outputs.source_release_version }}
        run: |
          if [[ "$PR_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::targets/prod.toml version ($PR_VERSION) does not match source release branch (release/v$RELEASE_VERSION)."
            exit 1
          fi
