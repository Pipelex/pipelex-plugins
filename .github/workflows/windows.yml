# The tests that must also pass on Windows, run under PowerShell with no bash.
#
# The first Windows machine the plugin targets has PowerShell and no Git Bash,
# so nothing the plugin runs for Claude Code may need bash. This job runs the
# `cross_os` selection of the unit suite (`make test-cross-os` on a Mac) the way
# that machine would: every step in PowerShell, bash and sh taken off the PATH
# before the tests, and the repository checked out with `core.autocrlf=true`,
# as Git for Windows does by default. docs/ci.md says what it proves and what
# it cannot.
#
# It calls no make target, since make and its recipes need bash: `uv run`
# installs the locked environment and runs pytest directly.
#
# A `workflow_dispatch` is read from the default branch, so the manual trigger
# stays inert until this file has reached `main` with a release; the pull
# request trigger runs it from the branch.
name: Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No process a job starts reports anonymous usage statistics (docs/ci.md, "No usage statistics").
env:
  DO_NOT_TRACK: "1"

jobs:
  cross-os:
    name: Cross-OS tests (PowerShell, no bash)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # `uv sync` re-locks when pyproject.toml has moved, which would have CI
      # test a dependency set the committed uv.lock does not describe. Assert
      # instead: a pull request that edits dependencies must carry the lock.
      UV_LOCKED: "1"
      # The Claude Code CLI is installed below, so its test must run, never skip.
      PIPELEX_PLUGINS_REQUIRE_CLAUDE_CLI: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # Set before the checkout, which reads it: a Windows clone converts LF to
      # CRLF unless the repository's attributes say otherwise.
      - name: Check out with Windows line endings
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # The launcher and the hook wrapper run on Node, and the launcher's
      # workshop test fetches @pipelex/mcp through npx.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Install the locked environment
        run: uv sync

      # Git for Windows puts bash and sh in Git\bin and Git\usr\bin; Git\cmd
      # holds git.exe alone and stays, since the tests call git. Any other
      # directory holding a bash.exe or sh.exe goes too, except System32, whose
      # bash.exe is the WSL launcher, which the next step proves runs nothing.
      - name: Take bash off the PATH
        run: |
          $system32 = [Environment]::SystemDirectory
          $kept = $env:PATH -split ';' | Where-Object {
            $_ -and (
              $_.TrimEnd('\') -ieq $system32 -or -not (
                (Test-Path -LiteralPath (Join-Path $_ 'bash.exe')) -or (Test-Path -LiteralPath (Join-Path $_ 'sh.exe'))
              )
            )
          }
          $removed = $env:PATH -split ';' | Where-Object { $_ -and ($kept -notcontains $_) }
          Write-Output "Removed from the PATH:"
          $removed | ForEach-Object { Write-Output "  $_" }
          "PATH=$($kept -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove no bash runs
        run: |
          $found = @(Get-Command bash, sh -All -ErrorAction SilentlyContinue)
          foreach ($command in $found) {
            try {
              $output = & $command.Source -c 'echo bash-ran' 2>&1 | Out-String
            } catch {
              $output = $_ | Out-String
            }
            # The launcher's refusal is expected; its exit code must not fail the step.
            $global:LASTEXITCODE = 0
            if ($output -match 'bash-ran') {
              Write-Error "$($command.Source) still runs a shell"
              exit 1
            }
            Write-Output "$($command.Source) resolves but runs no shell"
          }
          Get-Command git, node, npx, uv, claude | Format-Table Name, Source
          Write-Output "No bash or sh runs from the PATH."

      - name: Run the cross-OS tests
        run: uv run pytest -m cross_os -v
