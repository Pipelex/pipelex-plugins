# Enforces the branch flow: work branch → dev → release/vX.Y.Z → main.
#
# Convention enforcement rather than security — the real protection is the
# branch ruleset — so it catches a maintainer opening a pull request against the
# wrong base, which the workspace convention (PRs target `dev`; only a
# release/vX.Y.Z branch targets `main`) otherwise leaves to memory.
#
# Follows ../mthds-plugins/.github/workflows/guard-branches.yml for the
# `pull_request_target` trigger and ../pipelex-sdk-js/.github/workflows/guard-branches.yml
# for the three gates, the fork checks and the env-var discipline (a head ref is
# attacker-controlled text and is never interpolated into a shell command).
#
# The prefix set is the closed set of the workspace CLAUDE.md — fix, feature,
# refactor, chore, docs, ci-cd, changelog, codex. `feat/` is deliberately absent:
# the convention spells the word out.
#
# `pull_request_target` runs the copy of this file on the repository's DEFAULT
# branch — `main` here — whatever branch the pull request targets. It read the
# base branch's copy until GitHub changed that on 2025-12-08. Either way a fork
# cannot edit its own gate, which is the point; the consequence is that these
# gates report nothing at all — not a pass, not a skip — until this file has
# reached `main`, which happens only when a release merges, and a later edit to
# it is likewise inert until the next release carries it across.
name: Guard branch flow

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # main ← release/vX.Y.Z  (the release promotion, merged with a merge commit)
  gate-main:
    name: Gate main
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only release/vX.Y.Z from this repository may target main
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR → main from $HEAD ($HEAD_REPO)"
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::error::PRs to main must come from a release/vX.Y.Z branch in this repository, not a fork."
            exit 1
          fi
          if [[ ! "$HEAD" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only release/vX.Y.Z branches may merge into main."
            exit 1
          fi

  # release/vX.Y.Z ← dev, or a work branch carrying a fix onto the release
  gate-release:
    name: Gate release
    if: startsWith(github.event.pull_request.base.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Only this repository's dev or a work branch may target a release branch
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR → $BASE from $HEAD ($HEAD_REPO)"
          if [[ ! "$BASE" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branches must follow the release/vX.Y.Z semver pattern."
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::error::A release/vX.Y.Z PR must come from this repository, not a fork."
            exit 1
          fi
          if [[ "$HEAD" == "dev" ]]; then
            exit 0
          fi
          if [[ ! "$HEAD" =~ ^(fix|feature|refactor|chore|docs|ci-cd|changelog|codex)/[A-Za-z0-9._/=-]+$ ]]; then
            echo "::error::Branch must be dev, or start with fix/, feature/, refactor/, chore/, docs/, ci-cd/, changelog/, or codex/."
            exit 1
          fi

  # dev ← work branches  (everyday development, merged by squash)
  gate-dev:
    name: Gate dev
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Only work branches may target dev
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "PR → dev from $HEAD"
          if [[ ! "$HEAD" =~ ^(fix|feature|refactor|chore|docs|ci-cd|changelog|codex)/[A-Za-z0-9._/=-]+$ ]]; then
            echo "::error::Branch must start with fix/, feature/, refactor/, chore/, docs/, ci-cd/, changelog/, or codex/."
            exit 1
          fi
