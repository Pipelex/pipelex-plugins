# Tags a release when its merge lands on `main`: the annotated tag `vX.Y.Z`, read from
# `targets/prod.toml`'s `[plugin].version`, on the merge commit. The marketplace still serves
# `main` itself; the tag is the pin an outside target renders the skills at
# (`uvx --from git+https://github.com/Pipelex/pipelex-plugins@vX.Y.Z pipelex-plugins-render`),
# and the release skill's "What ships" section names this workflow and the tag, which
# `/ledger-land` reads to verify a release.
#
# Follows the workspace meta-repo's github-release.yml, with four departures. It creates no
# GitHub Release, since nothing but the tag is published. It runs on the push to `main` alone,
# with no `workflow_dispatch`, so it can never tag another branch's commit; a failed run is
# re-run from the Actions page, which repeats the same push. It validates the version as an
# `X.Y.Z` before it reaches a pattern or a tag name, as `changelog-check.yml` does. And a missing
# changelog heading is a warning rather than a refusal: the merge has already published the
# version to the marketplace, and a refusal would leave that version untagged with no re-run able
# to cure it. What stops a release for a missing entry is the release skill, which reads the
# `Changelog entry` check on the release pull request and stops on a red one; no ruleset requires
# that check.
#
# Only the push that raises the version tags, and only when the tag does not exist yet. A push
# that leaves the version alone, or lowers it, tags nothing, even when the tag is missing, so a
# later commit or a revert can never take a release's tag; the release's own run, re-run, is what
# tags it. There is no
# concurrency group, since GitHub cancels a pending run that a newer one supersedes in a group,
# which could cancel the release's run.
name: Release tag

on:
  push:
    branches:
      - main

jobs:
  release-tag:
    name: Release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the organization's default token is read-only, and pushing a tag needs write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tag list, and the commit before the push, to know what is already tagged and what changed

      - name: Read the version from targets/prod.toml
        run: |
          VERSION=$(python3 -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("targets/prod.toml").read_text())["plugin"]["version"])')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::targets/prod.toml [plugin].version is not an X.Y.Z version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version on main: $VERSION"

      - name: Decide whether this push releases a version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists, at $(git rev-list -n 1 "v$VERSION"): nothing to tag."
            exit 0
          fi
          PREVIOUS=$(git show "$BEFORE:targets/prod.toml" | python3 -c 'import sys,tomllib;print(tomllib.loads(sys.stdin.read())["plugin"]["version"])')
          if ! python3 -c 'import sys; before, after = (tuple(int(part) for part in v.split(".")) for v in sys.argv[1:]); sys.exit(after <= before)' "$PREVIOUS" "$VERSION"; then
            echo "::warning::v$VERSION is not tagged, and this push did not raise the version (it was $PREVIOUS), so it tags nothing: only the run of the push that raised the version to $VERSION tags it, and a re-run of that run does."
            exit 0
          fi
          echo "RELEASE=1" >> "$GITHUB_ENV"
          echo "This push moves the version from $PREVIOUS to $VERSION."

      - name: Create and push the annotated tag
        if: env.RELEASE == '1'
        run: |
          # This repo's changelog headings carry no `v`: `## [X.Y.Z] - YYYY-MM-DD`.
          if ! grep -qE "^## \[${VERSION//./\\.}\] - " CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no heading for $VERSION; tagging anyway, since the merge has already published it."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          echo "Tagged $(git rev-parse --short HEAD) as v$VERSION"
